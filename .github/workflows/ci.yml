name: CI
# Case codes are deliberately neutral: this file, the run title and the job log are all input to the
# triage agent, so nothing here may name the kind of failure. The code-to-label key is in triage/dataset.py.
run-name: CI (${{ github.event.inputs.case || 'push' }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: Test case
        type: choice
        default: none
        options:
          - none
          - case_a
          - case_b
          - case_c
          - case_d

env:
  CASE: ${{ github.event.inputs.case || 'none' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "$CASE" = "case_d" ]; then
            pip install "requests==99.0.0"
          fi

      - name: Fetch test fixtures
        run: |
          if [ "$CASE" = "case_c" ]; then
            curl --fail --silent --show-error --max-time 5 https://10.255.255.1/fixtures.tgz -o fixtures.tgz
          else
            echo "Fixtures cached, nothing to fetch"
          fi

      - name: Run tests
        run: pytest -v
