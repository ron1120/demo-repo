name: Triage failed CI

# Runs in the context of the default branch and can read repository secrets, so it must never
# check out or execute code from the failed run. It only reads that run's logs through the API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: pip install -r requirements.txt

      - name: Diagnose the failure and post to Slack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m triage notify --repo "$REPO" --run-id "$RUN_ID" --out diagnosis.json

      - name: Save diagnosis record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ github.event.workflow_run.id }}
          path: diagnosis.json
          if-no-files-found: warn
